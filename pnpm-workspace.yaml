packages:
  - apps/*
  - packages/*
  - tools/*

# Exact pins for test and deploy tooling: upgrade in dedicated PRs.
catalog:
  "@biomejs/biome": 2.6.5
  "@cloudflare/vite-plugin": 1.67.0
  "@cloudflare/vitest-plugin": 1.6.0
  "@modelcontextprotocol/server": 2.4.0
  "@msw/cloudflare": 0.2.0
  # Not 1.64 yet: its Chromium (156.0.8078.4) reports a script-src-attr refusal
  # for an on* attribute that is only parsed into an inert DOMParser document,
  # which nothing runs (measured 2026-11-04: Chromium 153.0.8010.12, Playwright
  # 1.63.0's, reports none for the same code). Mermaid's DOMPurify parses the e2e
  # suite's hostile labels that way, so "never had a script, style or image
  # refused by the policy on any page" fails with five "Executing inline event
  # handler" lines while window.pwned stays unset. Taking it means deciding what
  # that assertion should exempt.
  "@playwright/test": 1.64.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  # Follows the Node major the repository runs (24: .nvmrc, engines), not the
  # newest @types/node (26.x describes APIs Node 24 does not have).
  "@types/node": 26.6.6
  # Vitest stays on 5.0.3 (with its coverage provider): 5.0.4 turned
  # fsModuleCache on, and with it fyrden-api's Istanbul run in the Workers pool
  # loses its workerd workers ("Worker exited unexpectedly", 124 of 128 files)
  # at twice the memory (measured 2026-10-30: 4.6 GiB against 2.5 GiB on 5.0.3),
  # enough to take down a CI runner.
  "@vitest/coverage-istanbul": 5.1.0
  fast-check: 4.10.2
  hono: 4.13.16
  msw: 3.0.3
  turbo: 2.11.10
  typescript: 7.0.2
  # Not 8.3.5 yet: with vitest 5.0.5 it crashes formatting any stack trace that
  # passes through a globalSetup module ("No test files found"; verified:
  # https://github.com/vitest-dev/vitest/issues/11682). Upgrade it with the
  # vitest release that carries the fix (vitest-dev/vitest#11709).
  # Vitest 5.1.0 with vite 8.3.5 starts the API suite without that crash, but
  # it is not a fix to take yet (measured 2026-11-04): the API suite shuffled
  # with seed 1 fails 11 tests in 7 files (feed.operations, feed.purge,
  # fork-pulls, live, mergeability, merges, repos.delete) that all pass on
  # 5.0.3 with the same seed. Not measured on 5.1.0: the coverage run's memory.
  vite: 8.3.6
  vitest: 5.1.0
  wrangler: 4.158.0
  zod: 4.6.7

# Supply-chain policy. These match or tighten pnpm's defaults and are written
# out so a pnpm upgrade cannot loosen them silently.
# A release must be public for a day before it can be installed. Setting it
# explicitly also turns on strict mode: resolution fails when no version in
# the requested range is old enough (an older eligible version is still fine).
minimumReleaseAge: 1440
# Refuse a package whose new version lost the trust evidence (provenance or
# trusted publishing) that an earlier version had: the shape of a hijacked
# maintainer account.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Reviewed 2026-10-10: the CVE-2022-25883 backport, published 2023-07-10 by
  # an npm CLI maintainer without provenance, three days after 7.5.4 shipped
  # with it. Pulled in by @babel/core (via @react-router/dev). Exact version only.
  - semver@6.3.1
  # Reviewed 2026-10-16: theme data (frozen JSON objects, no scripts) for the
  # web app's diff renderer. Versions before 1.1.0 were published from CI with
  # provenance; 1.1.0 on are published by hand by a listed maintainer of the
  # same monorepo, who also publishes @pierre/diffs (which never had
  # provenance). Exact version only.
  - "@pierre/theme@2.0.0"
# Only direct dependencies may come from git or tarball URLs.
blockExoticSubdeps: true
# Install fails on any dependency build script not reviewed below.
strictDepBuilds: true
engineStrict: true
# New dependencies are added as exact versions (catalog pins are exact too).
savePrefix: ""

# Dependency build scripts reviewed and allowed to run (strictDepBuilds
# fails the install on any other); `false` would record a refusal.
allowBuilds:
  esbuild: true
  workerd: true

peerDependencyRules:
  allowedVersions:
    # Vitest's mocker declares msw 2 for browser-mode mocking, which Fyrden
    # does not use; outbound mocks use msw 3 through @msw/cloudflare.
    "@vitest/mocker>msw": "3"

overrides:
  "@types/node": "catalog:"
  # Reviewed 2026-10-30: typed-rest-client 2.3.1 (Stryker's dashboard client,
  # dev only; Stryker 10.0.0 wants ~2.3.0) pins qs 6.15.1, which has four
  # moderate advisories (GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx,
  # GHSA-4mjr-xmp4-gh2g, GHSA-6pq8-jhm2-2vcw). 6.16.1 is the patched release
  # of the same major. Drop this once Stryker moves to typed-rest-client 3.
  "typed-rest-client>qs": "6.16.1"
  # Reviewed 2026-11-04: Stryker 10.1.1 (dev only) asks for minimatch ~10.2.4, and every 10.x
  # release is inside GHSA-g3hv-75wg-m249 (denial of service via globparts amplification,
  # before 11.0.1; the new matcher is not backported to 10). Stryker calls only minimatch(),
  # new Minimatch() with dot, flipNegate and nocase, match(path, partial), negate and
  # hasMagic(), all unchanged in 11; a dry run of a mutation scope finds the same files and
  # mutants as on 10.2.6. Drop this once Stryker asks for minimatch 11.
  "@stryker-mutator/core>minimatch": "11.0.4"
  # Reviewed 2026-10-16: the diff renderer asks for shiki "^3.0.0 || ^4.0.0";
  # pinned to a release at least two weeks old instead of the newest in range.
  "@pierre/diffs>shiki": "4.4.3"
  "@pierre/diffs>@shikijs/transformers": "4.4.3"
  # Reviewed 2026-10-24: miniflare (through wrangler, dev and deploy tooling only) pins undici
  # 7.28.0, inside GHSA-xjj6-f33q-929c (a denial of service on excessive content-encodings,
  # 7.18.0 to 7.30.0). 7.30.1 is the patched release of the same minor line. Drop this once
  # miniflare moves past it.
  "miniflare>undici": "7.30.1"
  # Reviewed 2026-10-24: GHSA-mrhx-c7xc-m3w5 (memory exhausted validating oversized constrained
  # collections, before 4.6.6). @cloudflare/vitest-plugin 1.4.0 pins zod 4.6.5 exactly, and
  # Stryker's mutation-server-protocol resolves to it; every copy follows the catalog's patched
  # release of the same minor line.
  zod: "catalog:"
