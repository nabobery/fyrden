name: trigger-filters
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
    paths: ['src/**']
  pull_request:
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, closed, reopened, synchronize, converted_to_draft, locked, unlocked, milestoned, demilestoned, ready_for_review, review_requested, review_request_removed]
    branches-ignore: ['wip/**']
    paths-ignore: ['docs/**']
  pull_request_target:
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, closed, reopened, synchronize, converted_to_draft, locked, unlocked, milestoned, demilestoned, ready_for_review, review_requested, review_request_removed]
    branches: [main]
    paths: ['src/**']
  schedule:
    - cron: '0 5 * * 1'
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo filters
