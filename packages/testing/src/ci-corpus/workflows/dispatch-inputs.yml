name: dispatch-inputs
on:
  workflow_dispatch:
    inputs:
      word:
        description: A word to print
        required: true
        type: string
      flag:
        type: boolean
        default: false
      pick:
        type: choice
        options: [red, blue]
        default: red
      count:
        type: number
        default: 1
jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - env:
          WORD: ${{ inputs.word }}
          FLAG: ${{ inputs.flag }}
          PICK: ${{ inputs.pick }}
          COUNT: ${{ inputs.count }}
        run: echo "inputs $WORD $FLAG $PICK $COUNT"
