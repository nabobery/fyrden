name: secrets-and-vars
on: push
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: literal
        env:
          VALUE: ${{ secrets.CORPUS_SECRET }}
        run: echo "secret [$VALUE]"
      - name: dynamic
        env:
          ALL: ${{ toJSON(secrets) }}
        run: echo "$ALL" | grep CORPUS_SECRET
      - name: variable
        env:
          VARIABLE: ${{ vars.CORPUS_VAR }}
        run: echo "variable $VARIABLE"
