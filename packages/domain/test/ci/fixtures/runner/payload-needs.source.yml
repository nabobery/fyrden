name: needs
"on": push
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [prep]
    steps:
      - run: |
          echo "prep result=${{ needs.prep.result }} out=${{ needs.prep.outputs.version }}"
          echo "var=${{ vars.PROBE_VAR }} secret-len=${#S}"
        env:
          S: ${{ secrets.PROBE_SECRET }}
      - run: echo "masked? ${{ secrets.PROBE_SECRET }}"
