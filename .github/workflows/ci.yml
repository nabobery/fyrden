# Every pull request and every push to main. On main, the
# deploy jobs run only after every check passed for that exact commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/src/check-dco.ts "$BASE..$HEAD"

  check:
    name: Lint, typecheck, test, dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (high and critical fail the build)
        run: pnpm audit --audit-level=high
      - name: Lint and format (includes the core import boundary)
        run: pnpm lint:ci
      - name: Typecheck (and generated Worker types are current)
        run: pnpm turbo run typecheck
      - name: Unit and workerd integration tests with Istanbul coverage
        run: pnpm turbo run test:coverage
      - name: Shuffle guard (order-dependent workerd tests)
        run: pnpm turbo run test:shuffle
      - name: Dry-run deploy of both Workers
        run: pnpm turbo run deploy:dry-run
      - name: Both Workers together locally, through the service binding
        run: pnpm turbo run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: "**/coverage/coverage-final.json"
          if-no-files-found: ignore
          retention-days: 14

  # The git interoperability matrix, pull request subset: the pinned current
  # git (built once from its checked tarball and cached) against fyrden-api
  # under wrangler dev. The nightly workflow runs every case on more versions.
  interop:
    name: git interop (git 2.53.0, PR subset)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_VERSION: "2.53.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner image (part of the git build's cache key)
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cached git build
        id: git-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fyrden-git/${{ env.GIT_VERSION }}
          key: git-${{ env.GIT_VERSION }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/interop/git-versions.txt', 'tools/ci/interop/build-git.sh') }}
      - name: Build git from its checked release tarball
        if: steps.git-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcurl4-openssl-dev zlib1g-dev
          tools/ci/interop/build-git.sh "$GIT_VERSION" "$HOME/.cache/fyrden-git/$GIT_VERSION"
      - name: Interop matrix, pull request subset
        run: |
          export FYRDEN_GIT_BINARY="$HOME/.cache/fyrden-git/$GIT_VERSION/bin/git"
          "$FYRDEN_GIT_BINARY" --version
          pnpm --filter @fyrden/ci-tools test:interop

  # Mutation testing of the scopes a pull request changes, incrementally:
  # results for unchanged code come from the last nightly full run (cached).
  # Without that baseline (no nightly run yet, or the cache was evicted) the
  # changed scope runs in full, as the nightly job does, so the gate never
  # passes without checking; hence the nightly job's timeout.
  mutation:
    name: Mutation (${{ matrix.scope }}, incremental)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        scope:
          [protocol, object, hash, refs, pack, pack-write, graph, reader, receive-pack, upload-pack]
    env:
      SCOPE: ${{ matrix.scope }}
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did this pull request change the scope's code or the mutation setup?
        id: changed
        run: |
          if git diff --quiet "$BASE" HEAD -- "packages/git-core/src/$SCOPE" \
            packages/git-core/stryker.config.mjs packages/git-core/stryker; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changed.outputs.changed == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changed.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Last nightly results for this scope
        id: baseline
        if: steps.changed.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/git-core/reports/mutation/${{ matrix.scope }}.incremental.json
          key: mutation-incremental-${{ matrix.scope }}-${{ github.sha }}
          restore-keys: mutation-incremental-${{ matrix.scope }}-
      - name: Stryker, incremental (break below the recorded baseline)
        if: steps.changed.outputs.changed == 'true'
        env:
          RESTORED: ${{ steps.baseline.outputs.cache-matched-key }}
        working-directory: packages/git-core
        run: |
          if [ -z "$RESTORED" ]; then
            # Every mutant, at most 3 at a time (a 4-vCPU runner less one,
            # what the nightly run gets by default), each running Vitest.
            echo "::warning::No nightly mutation results for $SCOPE; running every mutant of the scope."
            FYRDEN_MUTATION_SCOPE="$SCOPE" pnpm exec stryker run --concurrency 3
          else
            FYRDEN_MUTATION_SCOPE="$SCOPE" pnpm exec stryker run --incremental
          fi

  # Paid staging and the Free smoke account. Each target is a
  # GitHub environment holding CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
  # FYRDEN_BOOTSTRAP_SECRET secrets and FYRDEN_API_URL / FYRDEN_WEB_URL
  # variables. A target without FYRDEN_DEPLOY_ENABLED=true is skipped, so
  # forks and fresh clones stay green.
  deploy:
    name: Deploy ${{ matrix.target }}
    needs: [check, interop]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            plan: paid
          - target: free-smoke
            plan: free
    environment: ${{ matrix.target }}
    steps:
      - name: Skip unless this environment is configured
        id: gate
        env:
          ENABLED: ${{ vars.FYRDEN_DEPLOY_ENABLED }}
        run: echo "enabled=${ENABLED:-false}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Require the bootstrap secret
        if: steps.gate.outputs.enabled == 'true'
        env:
          FYRDEN_BOOTSTRAP_SECRET: ${{ secrets.FYRDEN_BOOTSTRAP_SECRET }}
        run: |
          if [ -z "$FYRDEN_BOOTSTRAP_SECRET" ]; then
            echo "::error::FYRDEN_BOOTSTRAP_SECRET is not set for the ${{ matrix.target }} environment"
            exit 1
          fi
      - name: fyrden deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Preset, so the CLI never generates one and prints it into the run log.
          FYRDEN_BOOTSTRAP_SECRET: ${{ secrets.FYRDEN_BOOTSTRAP_SECRET }}
          PLAN: ${{ matrix.plan }}
        run: node packages/cli/src/index.ts deploy --plan "$PLAN"
      - name: Smoke test
        if: steps.gate.outputs.enabled == 'true'
        env:
          API_URL: ${{ vars.FYRDEN_API_URL }}
          WEB_URL: ${{ vars.FYRDEN_WEB_URL }}
        run: node tools/ci/src/smoke.ts "$API_URL" "$WEB_URL"
